<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Album Tốt Nghiệp</title>
<style>
body{font-family:Arial;margin:0;background:#071a2a;color:white;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;max-width:1000px;margin:20px auto;padding:0 12px}
.thumb img{width:100%;height:180px;object-fit:cover;border-radius:10px;cursor:pointer}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.15s}
.lightbox.open{opacity:1;pointer-events:auto}
.lightbox img{max-width:90%;max-height:90%;border-radius:12px}
.player{position:fixed;right:16px;bottom:16px;background:rgba(255,255,255,0.1);backdrop-filter:blur(6px);padding:8px;border-radius:10px;display:flex;gap:8px}
</style>
</head>
<body>

<h1>Album Tốt Nghiệp</h1>

<div class="grid" id="gallery">
  <div class="thumb" data-full="images/photo1.jpg"><img src="images/photo1.jpg"></div>
  <div class="thumb" data-full="images/photo2.jpg"><img src="images/photo2.jpg"></div>
</div>

<div class="lightbox" id="lb"><img id="lbImg"><button id="close" style="position:fixed;top:20px;right:20px">✕</button></div>

<div class="player">
  <button id="play">▶ Play</button>
  <button id="pause">⏸</button>
</div>

<audio id="audio" loop preload="metadata">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const gall=document.getElementById("gallery");
const lb=document.getElementById("lb");
const lbImg=document.getElementById("lbImg");
gall.addEventListener("click",e=>{
  let t=e.target.closest(".thumb");
  if(!t)return;
  lbImg.src=t.dataset.full;
  lb.classList.add("open");
});
document.getElementById("close").onclick=()=>lb.classList.remove("open");
lb.onclick=e=>{if(e.target===lb)lb.classList.remove("open");};

const audio=document.getElementById("audio");
document.getElementById("play").onclick=()=>audio.play();
document.getElementById("pause").onclick=()=>audio.pause();
</script>

</body>
</html>
